[package]
name = "starship-daemon"
version = "0.1.0"
edition = "2024"

[lib]
name = "starship_daemon"
path = "src/lib.rs"

[dependencies]
starship = { version = "1", default-features = false }
toml = "1"

[dev-dependencies]
tempfile = "3"
gix = { version = "0.85", features = ["max-performance-safe", "status", "revision"] }

[[bin]]
name = "starship-daemon"
path = "src/main.rs"

[[bench]]
name = "bench_hotpath"
harness = false

[[bench]]
name = "bench_discovery"
harness = false

[patch.crates-io]
starship = { git = "https://github.com/zdonghe/starship", branch = "main" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

