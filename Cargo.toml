[package]
name = "starship-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "starship_daemon"
path = "src/lib.rs"

[dependencies]
starship = "1"

[[bin]]
name = "starship-daemon"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
