[package]
name = "starship-daemon"
version = "0.1.0"
edition = "2024"

[lib]
name = "starship_daemon"
path = "src/lib.rs"

[dependencies]
starship = { version = "1", default-features = false }
toml = "1"

[dev-dependencies]
gix = { version = "=0.85.0", features = ["max-performance-safe", "status", "revision"] }
tempfile = "3"

[[bin]]
name = "starship-daemon"
path = "src/main.rs"

[patch.crates-io]
starship = { git = "https://github.com/zdonghe/starship", branch = "gix-native" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

# Fast dev deployment: inherits release settings but trades some runtime perf
# for faster compile. Use: cargo build --profile fast-release
[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16
