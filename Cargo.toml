[package]
name = "starship-daemon"
version = "0.1.0"
edition = "2021"

[lib]
name = "starship_daemon"
path = "src/lib.rs"

[dependencies]
fast-git-status = { path = "../git-fast", features = ["daemon"] }
starship = "1.26.0"
toml_edit = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "starship-daemon"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
