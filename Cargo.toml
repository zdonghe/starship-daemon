[package]
name = "starship-daemon"
version = "0.1.0"
edition = "2024"
description = "Persistent starship prompt daemon over a Windows named pipe"
repository = "https://github.com/zdonghe/starship-daemon"
license = "MIT"
readme = "README.md"
keywords = ["starship", "prompt", "named-pipe", "shell"]
categories = ["command-line-utilities"]
rust-version = "1.90"

[lib]
name = "starship_daemon"
path = "src/lib.rs"

[features]
default = ["fork"]

# Links the git fork of `starship`, which adds a segment-level render API
# (`get_prompt_with_cache` / `get_module_segments` / `ModuleCache`).
# Caches per-module segments and re-renders the prompt from them, so
# minute-bucket expiry never re-runs expensive modules like git_status.
fork = ["dep:starship-fork"]

# Links the upstream `starship` crate from crates.io.
# Caches whole rendered prompts (per key, minute bucket, exit code).
#
# Build with: cargo build --no-default-features --features stock
stock = ["dep:starship"]

[dependencies]
starship = { version = "1", default-features = false, optional = true }
starship-fork = { package = "starship", git = "https://github.com/zdonghe/starship", rev = "00aea6cadcc5d2e7ebd9fad45cea49f75eedc16d", default-features = false, optional = true }
toml = "1"
lru = "0.12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "starship-daemon"
path = "src/main.rs"

# Fork-only integration tests. `required-features` makes cargo skip these
# targets for stock builds instead of failing on the missing fork API.
[[test]]
name = "render_reuse"
required-features = ["fork"]

[[test]]
name = "render_reuse_fresh"
required-features = ["fork"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
