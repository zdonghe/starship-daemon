[package]
name = "starship-daemon"
version = "0.1.0"
edition = "2024"

[lib]
name = "starship_daemon"
path = "src/lib.rs"

[dependencies]
starship = { version = "1", default-features = false }
toml = "1"

[dev-dependencies]
# Uncomment for gix-native fork (faster git status):
# gix = { version = "0.85", features = ["max-performance-safe", "status", "revision"] }
tempfile = "3"

[[bin]]
name = "starship-daemon"
path = "src/main.rs"

# Uncomment for gix-native fork:
# [patch.crates-io]
# starship = { git = "https://github.com/zdonghe/starship", branch = "gix-native" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

