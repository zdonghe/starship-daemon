[package]
name = "starship-daemon"
version = "0.1.0"
edition = "2024"

[lib]
name = "starship_daemon"
path = "src/lib.rs"

[dependencies]
starship = { version = "1", default-features = false }

[[bin]]
name = "starship-daemon"
path = "src/main.rs"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true

# Fast dev deployment: inherits release settings but trades some runtime perf
# for faster compile. Use: cargo build --profile fast-release
[profile.fast-release]
inherits = "release"
lto = "thin"
codegen-units = 16
