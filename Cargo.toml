[package]
name = "starship-daemon"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "starship_daemon"
path = "src/lib.rs"

[features]
default = ["fork"]

# Links my fork of starship, which adds a segment-level render API
# Per module caching, time cache becoming invalid does not effect git status cache
fork = ["dep:starship-fork"]

# Links the upstream starship crate from crates.io.
#
# Build with: cargo build --no-default-features --features stock
stock = ["dep:starship"]

[dependencies]
starship = { version = "1", default-features = false, optional = true }
starship-fork = { package = "starship", git = "https://github.com/zdonghe/starship", rev = "00aea6cadcc5d2e7ebd9fad45cea49f75eedc16d", default-features = false, optional = true }
toml = "1"
lru = "0.12"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "starship-daemon"
path = "src/main.rs"

# Fork-only integration tests.
[[test]]
name = "render_reuse"
required-features = ["fork"]

[[test]]
name = "render_reuse_fresh"
required-features = ["fork"]

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "z"
panic = "abort"
strip = true
